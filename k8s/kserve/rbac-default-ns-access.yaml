# Lets the Kubeflow dashboard user (user@example.com) see InferenceServices
# that live in the "default" namespace (churn-model, sklearn-iris) - these
# were deployed before Kubeflow's per-user Profile namespaces existed.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeflow-user-default-ns-access
  namespace: default
subjects:
  - kind: User
    name: user@example.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: kubeflow-edit
  apiGroup: rbac.authorization.k8s.io
