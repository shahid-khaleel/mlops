apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
    - Namespace
    - ResourceQuota
    - StorageClass
    - CustomResourceDefinition
    - MutatingWebhookConfiguration
    - ServiceAccount
    - PodSecurityPolicy
    - NetworkPolicy
    - Role
    - ClusterRole
    - RoleBinding
    - ClusterRoleBinding
    - ConfigMap
    - Secret
    - Endpoints
    - Service
    - LimitRange
    - PriorityClass
    - PersistentVolume
    - PersistentVolumeClaim
    - Deployment
    - StatefulSet
    - CronJob
    - PodDisruptionBudget
    orderLast:
    - ValidatingWebhookConfiguration

resources:
# Istio (dashboard's ingress/routing depends on this)
- ../common/istio/istio-crds/base
- ../common/istio/istio-namespace/base
- ../common/istio/istio-install/overlays/oauth2-proxy
# Oauth2-proxy (auth in front of the gateway)
- ../common/oauth2-proxy/overlays/m2m-dex-only
# Dex (login provider)
- ../common/dex/overlays/oauth2-proxy
- ../common/istio/cluster-local-gateway/base
# Kubeflow namespace + roles
- ../common/kubeflow-namespace/base
- ../common/kubeflow-roles/base
# Kubeflow Istio routing resources
- ../common/istio/kubeflow-istio-resources/base
# Central Dashboard
- ../applications/dashboard/overlays/istio
# User namespace (so login has a profile to land in)
- ../common/user-namespace/base
